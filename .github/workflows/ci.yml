name: CI

on:
  pull_request:
    # `labeled`: adding `full-ci` starts the e2e jobs on the head, without a new push.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

# A new push makes the previous run pointless, `main` included: when squash-merges land back to
# back, only the last run goes to the end and publishes (no `sha` image for the ones in between).
# A run started by an unrelated label gets its own group, so it cannot cancel the real one.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.run_id || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether the change is more than docs; the e2e jobs are skipped when it is not. A job-level
  # filter, not `paths-ignore`: verify and the leak scan still run on docs (a secret can land there).
  changes:
    name: changes (docs only?)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the filter lists the pull request's files
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.claude/**'
              - '!LICENSE'

  verify:
    name: verify (every workspace · lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The server runs its TypeScript sources directly: Node 24 for every workspace.
          node-version: 24
          cache: npm
      - run: npm ci
      # The same gate as locally, kept as one script so the two never drift; it ends with
      # every workspace's own verify (contract, server).
      - run: npm run verify

  # Both e2e jobs run on main always; on a pull request only when it carries `full-ci`
  # (`/review-batch` puts it on the top of its chain). Skipped for a docs-only change.
  # They share nothing, so they start together: the preview build, and the release image.
  e2e-preview:
    name: e2e (Playwright · WebKit iPhone · preview build)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Chromium runs the offline spec only: Playwright's WebKit blocks service worker responses offline.
      - name: Install WebKit and Chromium
        run: npx playwright install --with-deps webkit chromium --only-shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install the browsers' OS deps
        run: npx playwright install-deps webkit chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 7

  e2e-image:
    name: e2e (release image · smoke and offline specs)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install WebKit and Chromium
        run: npx playwright install --with-deps webkit chromium --only-shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install the browsers' OS deps
        run: npx playwright install-deps webkit chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # The release image, loaded into the runner's Docker and never pushed here: publishing is
      # its own job, on main only.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: quit:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Run the image
        # A throwaway VAPID pair: the server refuses to start without one, and CI sends no push.
        run: |
          read -r public private < <(node -e "const k = require('web-push').generateVAPIDKeys(); console.log(k.publicKey, k.privateKey)")
          docker run -d --name quit -p 8080:8080 -v quit-data:/data \
            -e VAPID_PUBLIC_KEY="$public" -e VAPID_PRIVATE_KEY="$private" \
            -e VAPID_SUBJECT=mailto:ci@example.invalid quit:ci
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:8080/api/health
          test "$(docker exec quit id -u)" != 0
      # The shell and the offline launch, served by the server with its headers and CSP on.
      - run: npm run test:e2e -- smoke.spec.ts offline.spec.ts
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - name: Server logs on failure
        if: failure()
        run: docker logs quit || true
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-image
          path: playwright-report/
          retention-days: 7

  publish:
    name: publish (GHCR · sha and main tags)
    # `!cancelled()`: a docs-only push skips both e2e jobs, and a skipped need would skip publish with it;
    # unlike `always()`, a superseded run does not publish. A skipped e2e counts only when the
    # filter itself succeeded, never when it failed.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && needs.verify.result == 'success' && needs.secret-scan.result == 'success'
      && (needs.e2e-preview.result == 'success' || needs.e2e-preview.result == 'skipped')
      && (needs.e2e-image.result == 'success' || needs.e2e-image.result == 'skipped')
    needs: [changes, verify, e2e-preview, e2e-image, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the job's own token pushes to GHCR: no stored secret
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Image names are lowercase; the owner's login is not.
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # The same build as the one the e2e-image job ran against: every layer comes from its cache.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha,scope=image

  secret-scan:
    name: leak scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists the pull request's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the history, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
